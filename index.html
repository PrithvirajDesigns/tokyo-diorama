function showError(e){
  const el = document.getElementById('msg');
  el.textContent += (e && (e.stack || e.message || e)) + '\n';

window.addEventListener('error', ev => showError(ev.error || ev.message));

869 7.96 7.96M14 9.5C14 6.3548 14.026 4.46866 13.1 4.0773C12.3292 3.75147 11.5323 4.46765 10 6\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/></svg>", "volume-high": "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M14 14.8135V9.18646C14 6.04126 14 4.46866 13.0747 4.0773C12.1494 3.68593 11.0603 4.79793 8.88232 7.02192C7.75439 8.17365 7.11085 8.42869 5.50604 8.42869C4.10257 8.42869 3.40084 8.42869 2.89675 8.77262C1.85035 9.48655 2.00852 10.882 2.00852 12C2.00852 13.118 1.85035 14.5134 2.89675 15.2274C3.40084 15.5713 4.10257 15.5713 5.50604 15.5713C7.11085 15.5713 7.75439 15.8264 8.88232 16.9781C11.0603 19.2021 12.1494 20.3141 13.0747 19.9227C14 19.5313 14 17.9587 14 14.8135Z\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/><path d=\"M17 9C17.6254 9.81968 18 10.8634 18 12C18 13.1366 17.6254 14.1803 17 15\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/><path d=\"M20 7C21.2508 8.36613 22 10.1057 22 12C22 13.8943 21.2508 15.6339 20 17\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"/></svg>"};
const WX = { day: 0, season: 'rain', rain: true, umb: true, coat: 'mixed', neon: 1 };
const TUNE = {
  bloomStrength: 0.52,
  bloomRadius: 0.50,
  bloomThreshold: 0.85,
  neonGain: 1.0,
  spillGain: 1.0
};

/* =====================================================================
   SECTION 1: RENDERER, SCENE, CAMERA, POST-PROCESSING
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.32;
renderer.localClippingEnabled = true;          // used to cut the train at the slab edge
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x0a1020, 0.0016);

// Orthographic isometric camera (elevation 35.264 deg = true isometric)
const camTarget = new THREE.Vector3(0, 6, 0);
const ISO_ELEV = Math.atan(1 / Math.SQRT2);
const CAM_R = 120;
const camera = new THREE.OrthographicCamera(-40, 40, 30, -30, 1, 400);
let viewHalfH = 34;
function fitCamera(){
  const aspect = window.innerWidth / window.innerHeight;
  viewHalfH = Math.max(34, 47 / aspect);
  camera.left = -viewHalfH * aspect; camera.right = viewHalfH * aspect;
  camera.top = viewHalfH; camera.bottom = -viewHalfH;
  camera.updateProjectionMatrix();
}
fitCamera();

// Composer with MSAA target + bloom
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(
  window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio(),
  { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight),
  TUNE.bloomStrength, TUNE.bloomRadius, TUNE.bloomThreshold);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---- Orbit controls: drag = turn round, wheel/pinch = zoom, double-click = go back ---- */
camera.position.set(camTarget.x + CAM_R * Math.cos(ISO_ELEV) * Math.sin(Math.PI / 4),
                    camTarget.y + CAM_R * Math.sin(ISO_ELEV),
                    camTarget.z + CAM_R * Math.cos(ISO_ELEV) * Math.cos(Math.PI / 4));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(camTarget);
controls.enablePan = false;
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.9;
controls.minZoom = 0.6; controls.maxZoom = 3.2;
controls.minPolarAngle = 0.15; controls.maxPolarAngle = Math.PI / 2 - 0.04;   // never view from underneath the slab
controls.autoRotate = true; controls.autoRotateSpeed = 0.3;                    // slow gentle drift while idle
controls.update(); controls.saveState();
let idleTimer = 0;
const hintEl = document.getElementById('hint');
const hideHint = () => { if (hintEl) hintEl.style.opacity = '0'; };
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); hideHint(); });
controls.addEventListener('end', () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => { controls.autoRotate = true; }, 5000); });
renderer.domElement.addEventListener('dblclick', () => { controls.reset(); controls.autoRotate = true; clearTimeout(idleTimer); });
setTimeout(hideHint, 10000);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fitCamera();
});

/* =====================================================================
   SECTION 2: HELPERS + MATERIALS
   ===================================================================== */
const animators = [];           // functions (dt, t) called every frame
const neonMats = [];            // pulsing neon materials
const windowSets = [];          // instanced window meshes (flicker in a later stage)
const STALL_PEOPLE = [];        // people standing / sitting at the food stalls: drawn later with the same high-poly rig as the walkers
const OBSTACLES = [];           // [x, z, radius] solid things on the pavement that pedestrians (and their umbrellas) must keep away from

function neonMat(hex, k = 1.0){
  const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k * TUNE.neonGain) });
  neonMats.push({ m, base: m.color.clone(), phase: Math.random() * 6.28, speed: 1 + Math.random() * 2 });
  return m;
}
function std(color, o = {}){ return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.8, metalness: 0.05 }, o)); }
function box(w, h, d, mat, x, y, z, parent = scene, shadow = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent = scene, seg = 10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Fake wet-street reflections: a tiny procedural "environment" of colored light boxes
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x03050a);
[[0x00e5ff, -6, 3, 0], [0xff2fb4, 6, 3, -2], [0xffc266, 0, 2, 7], [0xff3030, 3, 1, -7], [0x4466ff, -4, 5, 5]]
  .forEach(([c, x, y, z]) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 3), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(0.8) }));
    b.position.set(x, y, z); envScene.add(b);
  });
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(envScene, 0.04).texture;

// ---- procedural canvas textures (generated here; nothing is loaded from outside) ----
function canvasTex(size, draw, srgb){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(g, n, size, lo, hi, a){
  for (let i = 0; i < n; i++){
    const v = lo + Math.random() * (hi - lo) | 0;
    g.fillStyle = `rgba(${v},${v},${v},${a})`;
    const w = 1 + Math.random() * 2;
    g.fillRect(Math.random() * size, Math.random() * size, w, w);
  }
}
const asphaltMap = canvasTex(512, (g, S) => { g.fillStyle = '#b4b8c0'; g.fillRect(0, 0, S, S); speckle(g, 14000, S, 90, 235, 0.55); }, true);
// roughness: mostly damp asphalt, with glossy puddle patches
const asphaltRough = canvasTex(512, (g, S) => {
  g.fillStyle = 'rgb(150,150,150)'; g.fillRect(0, 0, S, S); speckle(g, 6000, S, 120, 190, 0.5);
  for (let i = 0; i < 16; i++){
    const x = Math.random() * S, y = Math.random() * S, r = 28 + Math.random() * 55;
    const gr = g.createRadialGradient(x, y, 2, x, y, r); gr.addColorStop(0, 'rgba(95,95,95,0.9)'); gr.addColorStop(1, 'rgba(95,95,95,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}, false);
const paveMap = canvasTex(256, (g, S) => {
  g.fillStyle = '#c4c9d4'; g.fillRect(0, 0, S, S); speckle(g, 5000, S, 130, 230, 0.4);
  g.strokeStyle = '#7d8493'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, S - 3, S - 3);
  g.lineWidth = 1.2; g.strokeStyle = 'rgba(110,118,132,0.7)'; g.beginPath(); g.moveTo(S / 2, 0); g.lineTo(S / 2, S); g.moveTo(0, S / 2); g.lineTo(S, S / 2); g.stroke();
}, true);
const withRepeat = (tex, rx, ry) => { const t = tex.clone(); t.repeat.set(rx, ry); t.needsUpdate = true; return t; };
const asphaltMat = (rx, ry, color) => std(color, { map: withRepeat(asphaltMap, rx, ry), roughnessMap: withRepeat(asphaltRough, rx, ry),
  roughness: 1.0, metalness: 0.0 });

const M = {

/* =====================================================================
   SECTION 6: WINDOW FACADE HELPER (instanced glowing windows)
   ===================================================================== */
function addWindows(cx, cz, w, d, y0, rows, cols, rowGap, litChance = 0.6){
  const winGeo = new THREE.BoxGeometry(1.0, 1.3, 0.08);
  const faces = [
    { n: [0, 1],  t: [1, 0], fw: w, rot: 0 },
    { n: [0, -1], t: [1, 0], fw: w, rot: 0 },
    { n: [1, 0],  t: [0, 1], fw: d, rot: Math.PI / 2 },
    { n: [-1, 0], t: [0, 1], fw: d, rot: Math.PI / 2 }
  ];
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const count = faces.length * rows * cols;
  const im = new THREE.InstancedMesh(winGeo, mat, count);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  const col = new THREE.Color();
  let i = 0;
  faces.forEach(f => {
    const spacing = f.fw / (cols + 1.2);
    const half = (f.n[0] ? w : d) / 2; // distance from center to the face plane
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        const u = (c - (cols - 1) / 2) * spacing;
        p.set(cx + f.n[0] * (half + 0.04) + f.t[0] * u, y0 + r * rowGap, cz + f.n[1] * (half + 0.04) + f.t[1] * u);
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), f.rot);
        m4.compose(p, q, s); im.setMatrixAt(i, m4);
        const rnd = Math.random();
        if (rnd < litChance * 0.75)      col.setRGB(1.0, 0.72, 0.32).multiplyScalar(0.8 + Math.random() * 0.3); // warm
        else if (rnd < litChance)        col.setRGB(0.8, 0.9, 1.0).multiplyScalar(0.65 + Math.random() * 0.25); // cool white
        else                             col.setRGB(0.03, 0.05, 0.09);                                           // dark
        im.setColorAt(i, col);
        i++;
      }
    }
  });
  im.instanceColor.needsUpdate = true;
  scene.add(im);
  windowSets.push({ mesh: im, base: im.instanceColor.array.slice() });
  return im;
}

/* =====================================================================
   SECTION 11: TRAFFIC SIMULATION  (pure logic: no Three.js, no DOM)
   ---------------------------------------------------------------------
   Four straight lanes, each a ring that is longer than the slab:
     lane 0: X road, z=+2, heading -x      lane 1: X road, z=-2, heading +x
     lane 2: Z road, x=-2, heading -z      lane 3: Z road, x=+2, heading +z
   A car drives off the slab edge, is clipped out of sight (like the train),
   then re-enters at the far end. Left-hand traffic.
   Cars follow the Intelligent Driver Model (smooth accel/braking), treat
   a red/yellow light as a stopped obstacle at the stop line, and queue
   behind each other. Signal cycle: 10s green, 1.6s yellow, 1.4s all-red.
   ===================================================================== */
// @SIM-BEGIN
const SIM = (() => {
  const EDGE = 36, LANE = 2, LEN = 72;            // ring = 60 slab + 6 hidden margin each end
  const STOP_S = 25.55;                            // car centre halts here (nose just behind the stop line)
  const CAR_LEN = 3.5;
  const AMAX = 2.8, BCOMF = 3.4, S0 = 1.4, TH = 0.8, HORIZON = 45;
  const CYCLE = 26, GREEN = 10, YELLOW = 1.6, Z_OFFSET = 13;

  const wrap = s => ((s % LEN) + LEN) % LEN;

  // Position on a lane: [x, z, tangentX, tangentZ]
  function pathLane(lane, s){
    s = wrap(s);
    switch (lane){
      case 0:  return [EDGE - s, LANE, -1, 0];
      case 1:  return [-EDGE + s, -LANE, 1, 0];
      case 2:  return [-LANE, EDGE - s, 0, -1];
      default: return [LANE, -EDGE + s, 0, 1];
    }
  }

  function sigOf(u){ return u < GREEN ? 'green' : u < GREEN + YELLOW ? 'yellow' : 'red'; }
  function signal(t){
    const T = ((t % CYCLE) + CYCLE) % CYCLE;
    return { x: sigOf(T), z: sigOf((T - Z_OFFSET + CYCLE) % CYCLE) };
  }

  function createCars(counts = [2, 1, 2, 1], rnd = Math.random){
    const cars = [];
    counts.forEach((n, lane) => {
      for (let i = 0; i < n; i++){
        // X lanes start on green: spread anywhere. Z lanes start on red: keep them past the crossing.
        const s = lane < 2 ? (i * LEN / n + rnd() * 3) : (46 + i * 9 + rnd());
        const v0 = 6.0 + rnd() * 1.4;
        cars.push({ lane, s: wrap(s), v: v0 * (lane < 2 ? 1 : 0.8), v0, a: 0, brake: false });
      }
    });
    return cars;
  }

  function idmAccel(v, v0, gap, dv){
    const sStar = S0 + Math.max(0, v * TH + v * dv / (2 * Math.sqrt(AMAX * BCOMF)));
    return AMAX * (1 - Math.pow(v / v0, 4) - Math.pow(sStar / Math.max(gap, 0.1), 2));
  }

  function step(cars, t, dt, hold){
    const sig = signal(t);
    if (hold){ if (hold.x) sig.x = 'red'; if (hold.z) sig.z = 'red'; }   // a pedestrian is still on that crosswalk
    for (let L = 0; L < 4; L++){
      const state = L < 2 ? sig.x : sig.z;
      const list = cars.filter(c => c.lane === L).sort((a, b) => a.s - b.s);
      const n = list.length;
      for (let i = 0; i < n; i++){
        const c = list[i];
        let a = AMAX * (1 - Math.pow(c.v / c.v0, 4));
        if (n > 1){
          const ld = list[(i + 1) % n];
          a = Math.min(a, idmAccel(c.v, c.v0, wrap(ld.s - c.s) - CAR_LEN, c.v - ld.v));
        }
        if (state !== 'green'){
          let d = wrap(STOP_S - c.s);
          if (d > LEN - 1.2) d -= LEN;             // slightly past the stop point
          if (d > -1.2 && d < HORIZON){
            const canStop = state === 'red' || (d > 0.01 && c.v * c.v / (2 * d) <= 4.5);
            if (canStop) a = Math.min(a, idmAccel(c.v, c.v0, d + S0, c.v));
          }
        }
        c.a = Math.max(a, -12);
      }
    }
    for (const c of cars){
      c.v = Math.max(0, c.v + c.a * dt);
      c.s = wrap(c.s + c.v * dt);
      c.brake = c.a < -0.9 || c.v < 0.3;
    }
  }

  return { LEN, STOP_S, CAR_LEN, CYCLE, GREEN, YELLOW, Z_OFFSET, pathLane, signal, createCars, step };
})();
// @SIM-END

    const A = idx[i] * 3, B = idx[i + 1] * 3, C = idx[i + 2] * 3;
    vol += pos[A] * (pos[B + 1] * pos[C + 2] - pos[B + 2] * pos[C + 1]) - pos[A + 1] * (pos[B] * pos[C + 2] - pos[B + 2] * pos[C]) + pos[A + 2] * (pos[B] * pos[C + 1] - pos[B + 1] * pos[C]);

        r.v += (vt - r.v) * Math.min(1, dt * (vt > r.v ? 1.0 : 2.5));

        const x = r.dir > 0 ? r.u : -r.u, z = r.dir > 0 ? -EDGE_OFF : EDGE_OFF, h = r.dir > 0 ? Math.PI / 2 : -Math.PI / 2, vis = Math.abs(r.u) < 31;
        const yy = BASE_Y + 0.02 + (r.v > 0.1 ? Math.abs(Math.sin(r.wp * 1.7)) * 0.003 : 0);

  // ================= DELIVERY SCOOTER (smooth shell, headlamp, mirrors, springs, plate, topbox) =================
  { const g = new THREE.Group(); g.position.set(19.3, BASE_Y, -8.4); g.rotation.y = -0.4; scene.add(g);

}

/* =====================================================================
   SECTION 17: PEDESTRIANS (12 detailed people, each with an umbrella)
   - Smooth, articulated bodies: capsule limbs with knees and elbows, head with hair,
     shoes, hands and a coat on some; a full 8-panel umbrella with ribs, shaft and hook.
   - They walk a small network of sidewalks and crosswalks, keeping to the left.
   - At a crosswalk they wait at the kerb until the road's light has been red for a
     moment, there is enough red time left, and no car is near. While anyone is still
     on a crosswalk the cars are held at red.
   - They steer around each other (soft avoidance) and can never overlap (hard minimum gap).
   ===================================================================== */
{
  const NPED = 12;

  // ----- walking network -----
  const nodes = [], edges = [], adj = [];
  const node = (x, z) => { nodes.push([x, z]); adj.push([]); return nodes.length - 1; };
  const K = {};                                        // the 4 kerb corners at the crosswalks
  for (const sx of [1, -1]) for (const sz of [1, -1]) K[sx + ',' + sz] = node(sx * 6.1, sz * 6.1);
  function link(a, b, cross, line){
    for (const [p, q] of [[a, b], [b, a]]){
      const dx = nodes[q][0] - nodes[p][0], dz = nodes[q][1] - nodes[p][1], len = Math.hypot(dx, dz);
      const e = { a: p, b: q, len, ux: dx / len, uz: dz / len, cross, line };
      edges.push(e); adj[p].push(e);
    }
  }
  for (const sx of [1, -1]) for (const sz of [1, -1]){
    const k = K[sx + ',' + sz];
    link(k, node(sx * 17, sz * 6.1), null, 0);                 // sidewalk spoke along x
    link(k, node(sx * 6.1, sz * 17), null, 0);                 // sidewalk spoke along z
  }
  for (const sz of [1, -1]) link(K['1,' + sz], K['-1,' + sz], 'z', sz * 6.1);   // crosswalk over the Z road (walk along x)
  for (const sx of [1, -1]) link(K[sx + ',1'], K[sx + ',-1'], 'x', sx * 6.1);   // crosswalk over the X road (walk along z)

  const crossTime = (e, speed) => e.len * 0.7 / speed + 1.5;
  function crossingOK(e, speed){
    const off = e.cross === 'x' ? 0 : SIM.Z_OFFSET;
    const u = (((simT - off) % SIM.CYCLE) + SIM.CYCLE) % SIM.CYCLE;
    if (u < SIM.GREEN + SIM.YELLOW + 0.6) return false;           // light not red for long enough yet
    if (SIM.CYCLE - u < crossTime(e, speed) + 1.0) return false;  // not enough red time left
    for (const c of simCars){
      if ((c.lane < 2 ? 'x' : 'z') !== e.cross) continue;
      const p = SIM.pathLane(c.lane, c.s);
      if (Math.abs(e.cross === 'x' ? p[0] - e.line : p[1] - e.line) < 3.3) return false;   // a car is at the crosswalk
    }
    return true;
  }
  function pickNext(prev){
    let opts = adj[prev.b].filter(e => e.b !== prev.a);
    if (!opts.length) opts = adj[prev.b];                           // dead end: turn round
    const w = opts.map(e => e.cross ? 2.2 : 1), tot = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot;
    for (let i = 0; i < opts.length; i++){ r -= w[i]; if (r <= 0) return opts[i]; }
    return opts[opts.length - 1];
  }

  // ----- body geometry (origin = floor, +z = forward, +x = the person's left) -----
  const cap = (r, len, ty, rs = 14, cs = 6) => new THREE.CapsuleGeometry(r, len, cs, rs).translate(0, ty, 0);
  const THIGH = 0.45, SHIN = 0.43, UARM = 0.30, FARM = 0.27, HIP_Y = 0.93, SHOULDER_Y = 1.40;
  const geo = {
    torso: new THREE.CapsuleGeometry(0.15, 0.36, 8, 20).scale(1.35, 1, 0.85),
    coat:  (() => { const pts = [[0.2, 0], [0.235, -0.12], [0.27, -0.3], [0.285, -0.5]].map(([r, y]) => new THREE.Vector2(r, y));
                    return new THREE.LatheGeometry(pts, 24).scale(1.2, 1, 0.9); })(),
    head:  (() => { const h = new THREE.SphereGeometry(0.105, 28, 20).scale(0.92, 1.12, 1.0).translate(0, 0.135, 0.005);
                    const n = new THREE.CylinderGeometry(0.042, 0.05, 0.1, 12).translate(0, 0.03, 0);
                    const nose = new THREE.SphereGeometry(0.018, 8, 6).translate(0, 0.125, 0.105);
                    return mergeGeometries([h, n, nose]); })(),
    hair:  new THREE.SphereGeometry(0.113, 28, 16, 0, Math.PI * 2, 0, Math.PI * 0.62).scale(0.94, 1.14, 1.08).translate(0, 0.148, -0.012),
    thigh: cap(0.078, THIGH - 0.156, -THIGH / 2),
    shin:  cap(0.056, SHIN - 0.112, -SHIN / 2),
    shoe:  new THREE.CapsuleGeometry(0.048, 0.13, 5, 12).rotateX(Math.PI / 2).scale(1, 0.8, 1).translate(0, -0.035, 0.06),
    uarm:  cap(0.046, UARM - 0.092, -UARM / 2, 12),
    farm:  cap(0.038, FARM - 0.076, -FARM / 2, 12),
    hand:  new THREE.SphereGeometry(0.042, 14, 10).scale(1, 1.15, 0.8)
  };

  // Umbrella: dome with 8 panels that sag between the ribs, 8 ribs, shaft, ferrule and a J-hook handle.
  // Vertex colours separate the fabric (white = takes the umbrella's colour) from the dark metal parts.
  const umbrellaGeo = (() => {
    const R = 0.52, H = 0.26, BASE = 0.72;
    const paint = (g, v) => { const n = g.attributes.position.count, c = new Float32Array(n * 3).fill(v); g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return g; };
    const dome = new THREE.SphereGeometry(1, 48, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const p = dome.attributes.position;
    for (let i = 0; i < p.count; i++){
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i), rr = Math.hypot(x, z), phi = Math.atan2(z, x);
      const sag = 0.05 * (1 - Math.abs(Math.cos(4 * phi))) * rr;          // panels bow inwards between ribs
      p.setXYZ(i, x * R * (1 - sag * 1.2), BASE + y * H - sag * 0.07 * rr, z * R * (1 - sag * 1.2));
    }

    for (let k = 0; k < 8; k++){                                              // ribs follow the dome surface
      const phi = k * Math.PI / 4, pts = [];
      for (let j = 0; j <= 8; j++){ const t = j / 8, a = t * Math.PI / 2; pts.push(new THREE.Vector3(Math.cos(phi) * R * Math.sin(a) * 1.005, BASE + H * Math.cos(a) * 1.01 + 0.002, Math.sin(phi) * R * Math.sin(a) * 1.005)); }
      parts.push(paint(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, 0.006, 5, false), 0.18));
    }
    parts.push(paint(new THREE.CylinderGeometry(0.011, 0.011, BASE + H + 0.1, 8).translate(0, (BASE + H + 0.1) / 2 - 0.08, 0), 0.15));   // shaft
    parts.push(paint(new THREE.ConeGeometry(0.02, 0.08, 8).translate(0, BASE + H + 0.06, 0), 0.2));                                    // ferrule
    parts.push(paint(new THREE.TorusGeometry(0.035, 0.013, 8, 16, Math.PI).rotateZ(Math.PI).translate(0.035, -0.08, 0), 0.12));          // hook handle

  const matC = (o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: 0xffffff, roughness: 0.85 }, o));
  const SP = STALL_PEOPLE, NALL = NPED + 4 + SP.length;                                  // 12 walkers + 4 diners seated at the ramen stall
  const P = {
    torso:  instanced(geo.torso, matC(), NALL),
    coat:   instanced(geo.coat, matC({ side: THREE.DoubleSide }), NALL),
    head:   instanced(geo.head, matC({ roughness: 0.55 }), NALL),
    hair:   instanced(geo.hair, matC({ roughness: 0.6 }), NALL),
    thigh:  instanced(geo.thigh, matC(), NALL * 2),
    shin:   instanced(geo.shin, matC(), NALL * 2),
    shoe:   instanced(geo.shoe, matC({ roughness: 0.5 }), NALL * 2),
    uarm:   instanced(geo.uarm, matC(), NALL * 2),
    farm:   instanced(geo.farm, matC(), NALL * 2),
    hand:   instanced(geo.hand, matC({ roughness: 0.55 }), NALL * 2, false),
    umb:    instanced(umbrellaGeo, matC({ side: THREE.DoubleSide, vertexColors: true, roughness: 0.55, metalness: 0.1, emissive: 0x101010 }), NALL)
  };
  const UMB = [0xe53935, 0xffc107, 0x00acc1, 0xec407a, 0xf5f5f5, 0x3f6fe0, 0x8e44ad, 0xff7043, 0x43a047, 0xd81b60, 0x26c6da, 0xfdd835];
  const COAT = [0x2d3a55, 0x6b7a99, 0xa65a4a, 0x2b2f38, 0xc9b89a, 0x3f6b6e, 0x7a4658, 0x8a93a6, 0x5d7a52, 0xb48a52, 0x44506b, 0xd8d3c8];
  const PANTS = [0x1c1f27, 0x34405c, 0x555a66, 0x4a3d33, 0x2c4052];
  const SKIN = [0xe8b895, 0xd49a74, 0xb97a56, 0xf0c8a8, 0x8d5a3b];
  const HAIR = [0x15110e, 0x2b1d14, 0x4a3524, 0x0d0d10, 0x6b5a48];
  const SHOE = [0x101114, 0x2b2118, 0xe8e8ec, 0x1a2236];

  const peds = [];
  const startEdges = edges.filter(e => !e.cross);
  for (let i = 0; i < NPED; i++){
    let x, z, e, tries = 0;
    do {                                                     // start spread out, never on top of each other
      e = startEdges[Math.floor(Math.random() * startEdges.length)];
      const d = 0.5 + Math.random() * (e.len - 1);
      x = nodes[e.a][0] + e.ux * d; z = nodes[e.a][1] + e.uz * d;
    } while (peds.some(q => Math.hypot(q.x - x, q.z - z) < 2.4) && ++tries < 60);
    const hasCoat = i % 2 === 0;
    peds.push({
      x, z, vx: 0, vz: 0, edge: e, speed: 1.15 + Math.random() * 0.45, phase: Math.random() * 6.28, h: Math.atan2(e.ux, e.uz),
      su: Math.random() < 0.5 ? 1 : -1, waiting: false, hasCoat, scale: 0.94 + Math.random() * 0.12
    });
    const p = peds[i], cc = COAT[i % COAT.length];
    P.torso.setColorAt(i, col.set(cc)); P.uarm.setColorAt(i * 2, col.set(cc)); P.uarm.setColorAt(i * 2 + 1, col);
    P.farm.setColorAt(i * 2, col); P.farm.setColorAt(i * 2 + 1, col);
    if (hasCoat) P.coat.setColorAt(i, col.set(cc)); else { P.coat.setColorAt(i, col.set(cc)); P.coat.setMatrixAt(i, ZERO); }
    const skin = SKIN[(i * 3) % SKIN.length];
    P.head.setColorAt(i, col.set(skin)); P.hand.setColorAt(i * 2, col); P.hand.setColorAt(i * 2 + 1, col);
    P.hair.setColorAt(i, col.set(HAIR[(i * 2 + 1) % HAIR.length]));
    const pc = PANTS[(i * 3 + 1) % PANTS.length];
    P.thigh.setColorAt(i * 2, col.set(pc)); P.thigh.setColorAt(i * 2 + 1, col); P.shin.setColorAt(i * 2, col); P.shin.setColorAt(i * 2 + 1, col);
    P.shoe.setColorAt(i * 2, col.set(SHOE[i % SHOE.length])); P.shoe.setColorAt(i * 2 + 1, col);
    P.umb.setColorAt(i, col.set(UMB[i % UMB.length]));
  }
  // ----- the 4 diners on the ramen stall stools (static positions, animated arms / head) -----
  const DIN = [[11.15, 11.3, 0], [12.05, 11.3, 2.1], [12.95, 11.3, 4.2], [13.85, 11.3, 1.0]];
  DIN.forEach((d, k) => {
    const i = NPED + k, cc = [0x6b7a99, 0xa65a4a, 0x3f6b6e, 0xc9b89a][k];
    P.torso.setColorAt(i, col.set(cc)); P.uarm.setColorAt(i * 2, col); P.uarm.setColorAt(i * 2 + 1, col); P.farm.setColorAt(i * 2, col); P.farm.setColorAt(i * 2 + 1, col);

  });
  SP.forEach((a, k) => {                                              // food-stall people: same rig and look as the walkers
    const i = NPED + 4 + k;
    P.torso.setColorAt(i, col.set(a.color)); P.uarm.setColorAt(i * 2, col); P.uarm.setColorAt(i * 2 + 1, col); P.farm.setColorAt(i * 2, col); P.farm.setColorAt(i * 2 + 1, col);
    P.coat.setColorAt(i, col.set(a.color)); if (!a.coat) P.coat.setMatrixAt(i, ZERO);
    P.head.setColorAt(i, col.set(SKIN[a.skin % SKIN.length])); P.hand.setColorAt(i * 2, col); P.hand.setColorAt(i * 2 + 1, col);
    P.hair.setColorAt(i, col.set(a.hat ? 0xf2f2f2 : HAIR[a.hair % HAIR.length]));
    col.set(PANTS[(k * 3 + 1) % PANTS.length]); P.thigh.setColorAt(i * 2, col); P.thigh.setColorAt(i * 2 + 1, col); P.shin.setColorAt(i * 2, col); P.shin.setColorAt(i * 2 + 1, col);
    col.set(SHOE[k % SHOE.length]); P.shoe.setColorAt(i * 2, col); P.shoe.setColorAt(i * 2 + 1, col);
    P.umb.setColorAt(i, col.set(UMB[(k * 5 + 2) % UMB.length])); if (!(a.umb && a.role === 'wait')) P.umb.setMatrixAt(i, ZERO);
  });
  for (const k in P) if (P[k].instanceColor) P[k].instanceColor.needsUpdate = true;

  // ----- seasonal wardrobe: summer = bright tops, bare forearms + shorts; winter = dark coats + knitted beanies; etc. -----
  const WARD = {

    if (t > A.conT){ A.conOn = sum && day > 0.5 && !A.conOn; A.conT = t + (A.conOn ? 3 + Math.random() * 5 : 6 + Math.random() * 10); }
    if (!sum || day < 0.5) A.conOn = false;
    A.con.gn.gain.setTargetAtTime(A.conOn ? 0.02 : 0, now, 0.08); A.conLow.gn.gain.setTargetAtTime(A.conOn ? 0.03 : 0, now, 0.2);
    // wind: warm breeze (spring), dry crisp wind (autumn), freezing wind + howling blizzard (winter)
    const wf = { spring: 380, autumn: 900, winter: 520 }[sn];
    if (wf) A.wind.fl.frequency.setTargetAtTime(wf, now, 0.5);
    A.wind.gn.gain.setTargetAtTime(({ spring: 0.014 * (0.7 + 0.3 * Math.sin(t * 0.3)), autumn: 0.022 * (0.4 + 0.6 * gust), winter: 0.04 * (0.4 + 0.6 * gust) })[sn] || 0, now, 0.8);
    A.howl.fl.frequency.setTargetAtTime(sn === 'winter' ? 430 + 120 * gust : 1000, now, 0.6);
    A.howl.gn.gain.setTargetAtTime(sn === 'winter' ? 0.03 * gust : sn === 'autumn' ? 0.0055 * gust : 0, now, 0.5);
    A.hush.gn.gain.setTargetAtTime(sn === 'winter' ? 0.0028 : 0, now, 0.8);
    A.master.gain.setTargetAtTime(sn === 'rain' ? 0.9 + 0.3 * day : 0.62 + 0.55 * day, now, 0.8);                                                               // overall: clearly louder in daytime
    const tr = window.__train, tz = tr && tr.visible ? Math.abs(tr.position.z) : 99, prox = Math.exp(-(tz * tz) / 400);
    A.train.gn.gain.setTargetAtTime(0.06 * prox, now, 0.12); A.rg.gain.setTargetAtTime(0.09 * prox, now, 0.12);
    const ck = Math.max(0.25, cityK);
    if (t > A.nextHonk){ if (sn !== 'winter' || Math.random() < 0.4) honk(); A.nextHonk = t + (9 + Math.random() * 16) / ck; }
    if (t > A.nextPass){ pass(); A.nextPass = t + (4 + Math.random() * 7) / ck; }
    if (t > A.nextShop){ shopSound(); A.nextShop = t + (5 + Math.random() * 9) / Math.max(0.4, ck); }
    if (sn === 'spring'){ if (t > A.nextBird){ chirp(0.5 + 0.7 * day); A.nextBird = t + (day > 0.5 ? 0.5 + Math.random() * 1.8 : 9 + Math.random() * 14); } }
    if (sn === 'summer' && day > 0.5 && t > A.nextBell){ bell(); A.nextBell = t + 24 + Math.random() * 20; }
    if (sn === 'autumn'){ if (t > A.nextGeese){ geese(); A.nextGeese = t + 14 + Math.random() * 16; }
      if (t > A.nextRustle){ rustle(false); A.nextRustle = t + 0.25 + Math.random() * 1.1; } if (t > A.nextSwish){ rustle(true); A.nextSwish = t + 5 + Math.random() * 8; } }
    if (sn === 'winter' && t > A.nextCrunch){ crunch(); A.nextCrunch = t + 9 + Math.random() * 12; }
  });
}

/* =====================================================================
   SECTION 15: ANIMATION LOOP (orbit controls + soft neon pulse)
   ===================================================================== */
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  controls.update();            // handles drag / zoom / slow auto-drift

  // Soft neon pulse
  for (const n of neonMats){
    n.m.color.copy(n.base).multiplyScalar((0.9 + 0.1 * Math.sin(t * n.speed + n.phase)) * WX.neon);
  }
  for (const fn of animators) fn(dt, t);

  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Handy for later stages / debugging in the console
window.__diorama = { THREE, scene, camera, controls, renderer, bloom, TUNE, animators, neonMats, windowSets, M, SIM, simCars,
                     BASE_Y, RAIL_X, RAIL_Y, getSignal: () => SIM.signal(simT) };

} catch (e) { showError(e); console.error(e); }
</script>
